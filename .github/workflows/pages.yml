name: Deploy interactive sample

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '_vendor/**'
      - 'clip_snapshot.py'
      - 'tools/build_demo.py'
      - 'tools/sync_upstream.py'
      - 'tests/test_demo_build.py'
      - 'tests/test_upstream_sync.py'
      - '.gitattributes'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # ComfyUI supplies aiohttp at runtime; the standalone CI runner needs it for route tests.
      - run: python -m pip install aiohttp==3.13.3
      - run: python -m unittest discover -s tests -q
      - run: python tools/build_demo.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy sample
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
